# CHIP-8 Config file

# This config is case insensitive
# Valid Keys:
# a - z
# num0 - num 9 and numpad0 to numpad9
# f1 - f15
# Special keys: escape, lcontrol, rcontrol, lshift, rshift, lalt, ralt,
#               lsystem, rsystem, menu, space, enter, backspace, tab, pause,
#               pageup, pagedown, home, end, insert, delete,
#               add, subtract, multiply, divide, left, right, up, down,
#               lbracket, rbracket, semicolon, comma, period, apostrophe,
#               slash, backslash, grave, equal, hyphen

# KEYS:
#Pause = "Space"
1 = "Num1"
2 = "Num2"
3 = "Num3"
C = "Num4"
4 = "Q"
5 = "W"
6 = "E"
D = "R"
7 = "A"
8 = "S"
9 = "D"
E = "F"
A = "Z"
0 = "X"
B = "C"
F = "V"